[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boardeye"
version = "0.1.0"
description = "Photograph an over-the-board chess position and get an engine-ready FEN"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "opencv-python-headless>=4.8",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "chess>=1.10",
    "flask>=3.0",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
boardeye = "boardeye.cli:main"

[tool.setuptools.packages.find]
include = ["boardeye*"]

[tool.setuptools.package-data]
"boardeye.editor" = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
